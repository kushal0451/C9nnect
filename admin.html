<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraConnect — Admin CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-extrabold text-amber-400">AuraConnect Admin CMS</h1>
        <p class="text-xs text-slate-400">Manage global announcements, Tavern polls, user XP leaderboards, and confession moderation.</p>
      </div>
      <div class="flex items-center gap-2">
        <input id="adminKey" type="password" value="admin123" placeholder="Admin Key" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
        <button onclick="loadAll()" class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">Unlock / Refresh</button>
        <a href="/" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">← Back to App</a>
      </div>
    </div>

    <!-- Site Content & Poll Manager -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
      <h2 class="font-bold text-sm uppercase tracking-wider text-cyan-400">Live Site Banner & Tavern Poll</h2>
      <div class="space-y-2">
        <label class="text-xs text-slate-400">Top Announcement Banner</label>
        <input id="cmsAnnouncement" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm" />
      </div>
      <div class="space-y-2">
        <label class="text-xs text-slate-400">Tavern Live Poll Question</label>
        <input id="cmsPollQuestion" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm" />
      </div>
      <button onclick="saveCms()" class="px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs">Publish CMS Changes Live</button>
    </div>

    <!-- Users SQL Leaderboard -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
      <h2 class="font-bold text-sm uppercase tracking-wider text-purple-400">Registered SQL Users & Active XP</h2>
      <div id="usersTable" class="space-y-2 text-xs"></div>
    </div>

    <!-- Confession Moderation -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
      <h2 class="font-bold text-sm uppercase tracking-wider text-rose-400">Confessions Moderation</h2>
      <div id="confModList" class="space-y-2 text-xs"></div>
    </div>
  </div>

  <script>
    function key() { return document.getElementById('adminKey').value; }

    async function loadAll() {
      const cms = await (await fetch('/api/cms')).json();
      document.getElementById('cmsAnnouncement').value = cms.announcement;
      document.getElementById('cmsPollQuestion').value = cms.pollQuestion;

      const usersRes = await fetch('/api/admin/users', { headers: { 'x-admin-key': key() } });
      if (usersRes.ok) {
        const users = await usersRes.json();
        document.getElementById('usersTable').innerHTML = users.map(u => `
          <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
            <span><strong>${u.username}</strong> (${u.role}) • Theme: ${u.theme}</span>
            <span class="text-amber-400 font-bold">Lv.${u.level} (${u.xp} XP)</span>
          </div>
        `).join('');
      } else {
        document.getElementById('usersTable').innerHTML = '<p class="text-rose-400">Enter valid Admin CMS Key (default: admin123)</p>';
      }

      const confs = await (await fetch('/api/confessions')).json();
      document.getElementById('confModList').innerHTML = confs.map(c => `
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 gap-4">
          <span><strong>${c.author_name}:</strong> ${c.text}</span>
          <button onclick="delConf(${c.id})" class="px-3 py-1 rounded-lg bg-rose-600 text-white font-bold shrink-0">Delete</button>
        </div>
      `).join('');
    }

    async function saveCms() {
      const res = await fetch('/api/admin/cms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': key() },
        body: JSON.stringify({
          announcement: document.getElementById('cmsAnnouncement').value,
          pollQuestion: document.getElementById('cmsPollQuestion').value
        })
      });
      alert(res.ok ? 'CMS updated and broadcast to all connected clients!' : 'Invalid Admin Key');
    }

    async function delConf(id) {
      await fetch('/api/admin/confessions/' + id, { method: 'DELETE', headers: { 'x-admin-key': key() } });
      loadAll();
    }

    loadAll();
  </script>
</body>
</html>

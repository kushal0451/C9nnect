<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AetherRealm — Admin CMS</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0e17;
      color: #f1f5f9;
      margin: 0;
      padding: 24px;
    }
    .wrap { max-width: 1120px; margin: 0 auto; }
    .card {
      background: #131829;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    input {
      background: #0b0e17;
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: #fff;
      padding: 9px 12px;
      border-radius: 9px;
      flex: 1;
    }
    button {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }
    button.danger { background: #ef4444; padding: 6px 10px; font-size: 0.8rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.88rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    th { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>🛡️ AetherRealm Admin Console</h2>
      <div class="row">
        <input id="admin-key" type="password" placeholder="Enter ADMIN_KEY..." />
        <button onclick="loadAdminData()">Unlock & Load</button>
      </div>
      <p id="status-msg" style="color:#f59e0b; font-size:0.85rem; margin-top:8px;"></p>
    </div>

    <div class="card">
      <h3>👥 Registered Citizens</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Level</th>
            <th>XP</th>
            <th>Honor</th>
            <th>Cowoncy</th>
            <th>Warnings</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>📜 Void Scrolls / Confessions Moderation</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Author</th>
            <th>Content</th>
            <th>Likes</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="confs-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadAdminData() {
      const key = document.getElementById("admin-key").value.trim();
      const status = document.getElementById("status-msg");
      status.textContent = "";
      try {
        const res = await fetch("/api/admin/overview", { headers: { "x-admin-key": key } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Unauthorized");

        const uBody = document.getElementById("users-tbody");
        uBody.innerHTML = "";
        data.users.forEach(u => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${u.id}</td><td><strong>@${u.username}</strong></td><td>${u.level}</td><td>${u.xp}</td><td>${u.honor}</td><td>${u.cowoncy}</td><td>${u.warnings || 0}</td>`;
          uBody.appendChild(tr);
        });

        const cBody = document.getElementById("confs-tbody");
        cBody.innerHTML = "";
        data.confessions.forEach(c => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${c.id}</td><td>${c.author}</td><td>${c.content}</td><td>${c.likes}</td><td><button class="danger" onclick="delConf(${c.id})">Delete</button></td>`;
          cBody.appendChild(tr);
        });
        status.textContent = `Loaded ${data.users.length} users and ${data.confessions.length} scrolls.`;
      } catch (e) {
        status.textContent = e.message;
      }
    }

    async function delConf(id) {
      const key = document.getElementById("admin-key").value.trim();
      await fetch(`/api/admin/confessions/${id}`, { method: "DELETE", headers: { "x-admin-key": key } });
      loadAdminData();
    }
  </script>
</body>
</html>

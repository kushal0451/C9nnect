<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C9nnect — Admin CMS &amp; Moderation</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-extrabold text-amber-400">C9nnect Admin CMS</h1>
        <p class="text-xs text-slate-400">PostgreSQL user leaderboard, live confession moderation &amp; site status.</p>
      </div>
      <div class="flex items-center gap-2">
        <input id="adminKey" type="password" value="admin123" placeholder="Admin Key" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
        <button type="button" onclick="loadAll()" class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">Refresh Data</button>
        <a href="/" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">← Back to C9nnect</a>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
      <h2 class="font-bold text-sm uppercase tracking-wider text-purple-400">Registered PostgreSQL Players</h2>
      <div id="usersTable" class="space-y-2 text-xs"></div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
      <h2 class="font-bold text-sm uppercase tracking-wider text-rose-400">Confessions Moderation</h2>
      <div id="confModList" class="space-y-2 text-xs"></div>
    </div>
  </div>

  <script>
    function key() { return document.getElementById('adminKey').value; }
    async function loadAll() {
      const users = await (await fetch('/api/users')).json();
      document.getElementById('usersTable').innerHTML = users.map(u => `
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
          <span><strong>${u.username}</strong> • Honor: ${u.honor}</span>
          <span class="text-amber-400 font-bold">Lv.${u.level} (${u.xp} XP)</span>
        </div>
      `).join('') || '<p class="text-slate-400">No users yet.</p>';

      const confs = await (await fetch('/api/confessions')).json();
      document.getElementById('confModList').innerHTML = confs.map(c => `
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 gap-4">
          <span><strong>${c.author_name}:</strong> ${c.text}</span>
          <button type="button" onclick="delConf(${c.id})" class="px-3 py-1 rounded-lg bg-rose-600 text-white font-bold shrink-0">Delete</button>
        </div>
      `).join('') || '<p class="text-slate-400">No confessions yet.</p>';
    }

    async function delConf(id) {
      const res = await fetch('/api/admin/confessions/' + id, { method: 'DELETE', headers: { 'x-admin-key': key() } });
      if (res.ok) loadAll();
    }
    loadAll();
  </script>
</body>
</html>
